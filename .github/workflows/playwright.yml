name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke
          - auth
          - gameplay
          - ai
          - history
          - profile
          - p0
          - p1
          - critical

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SUITE="${{ github.event.inputs.suite }}"
          else
            SUITE="smoke"
          fi
          echo "Running suite: $SUITE"
          case "$SUITE" in
            full) npx playwright test ;;
            smoke) npm run test:smoke ;;
            auth) npm run test:auth ;;
            gameplay) npm run test:gameplay ;;
            ai) npm run test:ai ;;
            history) npm run test:history ;;
            profile) npm run test:profile ;;
            p0) npm run test:p0 ;;
            p1) npm run test:p1 ;;
            critical) npm run test:critical ;;
            *) echo "Unknown suite: $SUITE"; exit 1 ;;
          esac

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
